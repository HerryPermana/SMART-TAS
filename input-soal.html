<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Soal Ujian - KTSM8 Guru</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .card-custom { border: none; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .badge-tipe { font-size: 0.8rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="dashboard-guru.html">⬅️ Kembali ke Dashboard Guru</a>
    <span class="navbar-text text-white">Login: <b id="namaGuru">-</b></span>
  </div>
</nav>

<div class="container mb-5">
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card card-custom p-4">
        <h4 class="fw-bold mb-3 text-primary">➕ Tambah Soal Baru</h4>
        <form id="formInputSoal" onsubmit="simpanSoal(event)">
          
          <div class="mb-3">
            <label for="selectMapel" class="form-label fw-bold">Mata Pelajaran</label>
            <select id="selectMapel" class="form-select" onchange="loadDaftarSoal(this.value)" required>
              <option value="">-- Memuat Mapel --</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="selectTipe" class="form-label fw-bold">Tipe Soal TKA</label>
            <select id="selectTipe" class="form-select" onchange="renderFormOpsi()" required>
              <option value="PG_SEDERHANA">Pilihan Ganda Sederhana (1 Jawaban Benar)</option>
              <option value="PGK_MCMA">PGK MCMA (Pilih >1 Jawaban Benar)</option>
              <option value="PGK_KATEGORI">PGK Kategori (Pernyataan Benar / Salah)</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="txtPertanyaan" class="form-label fw-bold">Pokok Pertanyaan / Soal</label>
            <textarea id="txtPertanyaan" class="form-control" rows="3" placeholder="Tuliskan pertanyaan soal di sini..." required></textarea>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label fw-bold mb-0">Opsi Jawaban &amp; Kunci Jawaban</label>
              <button type="button" class="btn btn-sm btn-outline-secondary" onclick="tambahBarisOpsi()">➕ Tambah Baris Opsi</button>
            </div>
            <div id="containerFormOpsi" class="p-3 bg-light rounded border"></div>
          </div>

          <button type="submit" id="btnSimpan" class="btn btn-success btn-lg w-100 fw-bold">💾 Simpan Soal ke Spreadsheet</button>
        </form>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="card card-custom p-4">
        <h4 class="fw-bold mb-3">📋 Soal Terdaftar</h4>
        <div id="containerListSoal" style="max-height: 650px; overflow-y: auto;">
          <div class="text-muted text-center py-4">Pilih Mata Pelajaran untuk melihat daftar soal.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth-nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const session = JSON.parse(localStorage.getItem('userSession'));

  document.addEventListener("DOMContentLoaded", function() {
    if (session) {
      document.getElementById('namaGuru').innerText = session.nama || 'Guru';
    }
    loadDaftarMapel();
    renderFormOpsi();
  });

  function loadDaftarMapel() {
    const select = document.getElementById('selectMapel');
    
    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ 
        action: 'getMapel', 
        kelas: 'guru',
        idUser: session ? session.id : ''
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success' && data.mapel && data.mapel.length > 0) {
        select.innerHTML = '<option value="">-- Pilih Mata Pelajaran --</option>';
        data.mapel.forEach(m => {
          select.innerHTML += `<option value="${m.idMapel}">${m.namaMapel} (${m.idMapel}) - Kelas ${m.kelas}</option>`;
        });
      } else {
        select.innerHTML = '<option value="">Belum ada mapel tersedia</option>';
      }
    })
    .catch(err => {
      console.error(err);
      select.innerHTML = '<option value="">Gagal memuat mapel</option>';
    });
  }

  function renderFormOpsi() {
    const tipe = document.getElementById('selectTipe').value;
    const container = document.getElementById('containerFormOpsi');
    container.innerHTML = '';

    if (tipe === 'PG_SEDERHANA') {
      for (let i = 0; i < 4; i++) container.innerHTML += createOpsiRowPG(i, 'radio');
    } else if (tipe === 'PGK_MCMA') {
      for (let i = 0; i < 4; i++) container.innerHTML += createOpsiRowPG(i, 'checkbox');
    } else if (tipe === 'PGK_KATEGORI') {
      for (let i = 0; i < 3; i++) container.innerHTML += createOpsiRowKategori(i);
    }
  }

  function createOpsiRowPG(index, inputType) {
    const labelBadge = String.fromCharCode(65 + index);
    return `
      <div class="row g-2 align-items-center mb-2 opsi-item">
        <div class="col-auto"><span class="badge bg-secondary">${labelBadge}</span></div>
        <div class="col"><input type="text" class="form-control txt-opsi" placeholder="Tulis teks opsi ${labelBadge}..." required></div>
        <div class="col-auto text-center" style="min-width: 90px;">
          <div class="form-check form-check-inline me-0">
            <input class="form-check-input chk-kunci" type="${inputType}" name="kunciChoice" id="kunci_${index}">
            <label class="form-check-label small" for="kunci_${index}">Kunci</label>
          </div>
        </div>
      </div>`;
  }

  function createOpsiRowKategori(index) {
    return `
      <div class="row g-2 align-items-center mb-2 opsi-item">
        <div class="col"><input type="text" class="form-control txt-opsi" placeholder="Tulis pernyataan ${index + 1}..." required></div>
        <div class="col-auto">
          <select class="form-select select-kunci-kat" style="width: 110px;">
            <option value="Benar">Benar</option>
            <option value="Salah">Salah</option>
          </select>
        </div>
      </div>`;
  }

  function tambahBarisOpsi() {
    const tipe = document.getElementById('selectTipe').value;
    const container = document.getElementById('containerFormOpsi');
    const currentCount = container.querySelectorAll('.opsi-item').length;

    if (tipe === 'PG_SEDERHANA') container.insertAdjacentHTML('beforeend', createOpsiRowPG(currentCount, 'radio'));
    else if (tipe === 'PGK_MCMA') container.insertAdjacentHTML('beforeend', createOpsiRowPG(currentCount, 'checkbox'));
    else if (tipe === 'PGK_KATEGORI') container.insertAdjacentHTML('beforeend', createOpsiRowKategori(currentCount));
  }

  function simpanSoal(e) {
    e.preventDefault();
    const idMapel = document.getElementById('selectMapel').value;
    const tipe = document.getElementById('selectTipe').value;
    const pertanyaan = document.getElementById('txtPertanyaan').value;

    if (!idMapel) { alert("Pilih Mata Pelajaran!"); return; }

    const arrayOpsi = [];
    let kunciJawaban = null;

    if (tipe === 'PG_SEDERHANA') {
      document.querySelectorAll('.opsi-item').forEach(item => {
        const txt = item.querySelector('.txt-opsi').value.trim();
        if (txt) {
          arrayOpsi.push(txt);
          if (item.querySelector('.chk-kunci').checked) kunciJawaban = txt;
        }
      });
      if (!kunciJawaban) { alert("Pilih 1 kunci jawaban!"); return; }
    } 
    else if (tipe === 'PGK_MCMA') {
      kunciJawaban = [];
      document.querySelectorAll('.opsi-item').forEach(item => {
        const txt = item.querySelector('.txt-opsi').value.trim();
        if (txt) {
          arrayOpsi.push(txt);
          if (item.querySelector('.chk-kunci').checked) kunciJawaban.push(txt);
        }
      });
      if (kunciJawaban.length === 0) { alert("Pilih minimal 1 kunci jawaban!"); return; }
    } 
    else if (tipe === 'PGK_KATEGORI') {
      kunciJawaban = {};
      document.querySelectorAll('.opsi-item').forEach(item => {
        const txt = item.querySelector('.txt-opsi').value.trim();
        if (txt) {
          arrayOpsi.push(txt);
          kunciJawaban[txt] = item.querySelector('.select-kunci-kat').value;
        }
      });
    }

    const btnSimpan = document.getElementById('btnSimpan');
    btnSimpan.disabled = true;
    btnSimpan.innerText = 'Menyimpan...';

    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'addSoal',
        idMapel: idMapel,
        tipe: tipe,
        pertanyaan: pertanyaan,
        opsi: arrayOpsi,
        kunci: kunciJawaban
      })
    })
    .then(res => res.json())
    .then(data => {
      btnSimpan.disabled = false;
      btnSimpan.innerText = '💾 Simpan Soal ke Spreadsheet';

      if (data.status === 'success') {
        alert("Berhasil menyimpan soal!");
        document.getElementById('txtPertanyaan').value = '';
        renderFormOpsi();
        loadDaftarSoal(idMapel);
      } else {
        alert("Gagal: " + data.message);
      }
    })
    .catch(() => {
      btnSimpan.disabled = false;
      btnSimpan.innerText = '💾 Simpan Soal ke Spreadsheet';
      alert("Terjadi kesalahan koneksi!");
    });
  }

  function loadDaftarSoal(idMapel) {
    const container = document.getElementById('containerListSoal');
    if (!idMapel) {
      container.innerHTML = '<div class="text-muted text-center py-4">Pilih Mata Pelajaran untuk melihat daftar soal.</div>';
      return;
    }

    container.innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm text-primary"></div> Memuat...</div>';

    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getSoal', idMapel: idMapel, kelas: 'guru' })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success' && data.soal && data.soal.length > 0) {
        container.innerHTML = '';
        data.soal.forEach((s, i) => {
          container.innerHTML += `
            <div class="card p-3 mb-2 border-start border-4 border-primary shadow-sm">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="fw-bold">#${i+1} (${s.idSoal})</span>
                <div class="d-flex align-items-center gap-1">
                  <span class="badge bg-info text-dark badge-tipe me-1">${s.tipe}</span>
                  <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="hapusSoal('${s.idSoal}')" title="Hapus Soal">🗑️ Hapus</button>
                </div>
              </div>
              <p class="mb-1 text-dark">${s.pertanyaan}</p>
              <small class="text-muted">Jumlah Opsi/Pernyataan: ${s.opsi.length}</small>
            </div>`;
        });
      } else {
        container.innerHTML = '<div class="alert alert-warning text-center">Belum ada soal untuk mata pelajaran ini.</div>';
      }
    })
    .catch(err => {
      console.error(err);
      container.innerHTML = '<div class="alert alert-danger text-center">Gagal memuat soal.</div>';
    });
  }

  function hapusSoal(idSoal) {
    if (!confirm(`Apakah Anda yakin ingin menghapus soal dengan ID (${idSoal}) ini?`)) return;

    const idMapel = document.getElementById('selectMapel').value;

    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'deleteSoal',
        idSoal: idSoal
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        alert("Soal berhasil dihapus!");
        loadDaftarSoal(idMapel);
      } else {
        alert("Gagal menghapus soal: " + (data.message || "Terjadi kesalahan."));
      }
    })
    .catch(err => {
      console.error(err);
      alert("Terjadi kesalahan koneksi saat menghapus soal.");
    });
  }
</script>
</body>
</html>
