<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Soal Ujian - Portal Akademik Guru</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Font selaras dengan Dashboard */
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
    
    body { 
      background-color: #f8f9fa; 
      font-family: 'Nunito', sans-serif; 
    }
    
    /* Navbar Gradient */
    .navbar-custom { 
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* Card Custom Style */
    .card-custom { 
      background: #ffffff;
      border: 1px solid #edf2f9; 
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.04); 
    }

    /* Form Styling */
    .form-label { color: #495057; }
    .form-control, .form-select {
      border-radius: 8px;
      border: 1px solid #dee2e6;
      transition: all 0.3s ease;
    }
    .form-control:focus, .form-select:focus {
      border-color: #4facfe;
      box-shadow: 0 0 0 0.25rem rgba(79, 172, 254, 0.25);
    }

    /* Container Opsi Jawaban */
    .opsi-container {
      background: #fdfdfe;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      padding: 20px;
    }
    .opsi-item {
      background: #ffffff;
      border: 1px solid #f1f3f5;
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
    }
    .opsi-item:hover {
      border-color: #4facfe;
      box-shadow: 0 4px 10px rgba(79, 172, 254, 0.1);
    }

    /* Tombol Simpan Gradient */
    .btn-simpan {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      border: none;
      color: white;
      border-radius: 10px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .btn-simpan:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
      color: white;
    }

    /* List Soal Styling */
    .list-soal-wrapper {
      max-height: 700px; 
      overflow-y: auto;
      padding-right: 5px;
    }
    /* Kustomisasi Scrollbar untuk panel kanan */
    .list-soal-wrapper::-webkit-scrollbar { width: 6px; }
    .list-soal-wrapper::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
    .list-soal-wrapper::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
    .list-soal-wrapper::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

    .soal-card {
      border-radius: 12px;
      border: none;
      border-left: 5px solid #4facfe !important;
      background: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .soal-card:hover {
      transform: translateX(4px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }
    
    .badge-tipe { font-size: 0.75rem; letter-spacing: 0.5px; }
    .badge-opsi { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: bold;}
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="dashboard-guru.html">
      <span class="fs-4">⬅️</span> <span>Kembali ke Dashboard</span>
    </a>
    <div class="ms-auto">
      <span class="text-white fw-semibold px-3 py-1 rounded-pill bg-white bg-opacity-25">
        👤 <span id="namaGuru">Guru</span>
      </span>
    </div>
  </div>
</nav>

<div class="container mb-5">
  <!-- HEADER TITLE -->
  <div class="mb-4 text-center text-md-start">
    <h3 class="fw-bold text-dark mb-1">✍️ Manajemen Bank Soal</h3>
    <p class="text-secondary">Tambah, atur, dan hapus soal ujian untuk setiap mata pelajaran.</p>
  </div>

  <div class="row g-4">
    <!-- PANEL KIRI: INPUT SOAL -->
    <div class="col-lg-7">
      <div class="card card-custom p-4 p-md-5">
        <h4 class="fw-bold mb-4 text-primary d-flex align-items-center gap-2">
          ➕ Form Tambah Soal Baru
        </h4>
        <form id="formInputSoal" onsubmit="simpanSoal(event)">
          
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="selectMapel" class="form-label fw-bold small">📚 Mata Pelajaran</label>
              <select id="selectMapel" class="form-select bg-light" onchange="loadDaftarSoal(this.value)" required>
                <option value="">-- Memuat Mapel --</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="selectTipe" class="form-label fw-bold small">⚙️ Tipe Soal</label>
              <select id="selectTipe" class="form-select bg-light" onchange="renderFormOpsi()" required>
                <option value="PG_SEDERHANA">Pilihan Ganda (1 Jawaban Benar)</option>
                <option value="PGK_MCMA">PG Kompleks (Lebih dari 1 Jawaban)</option>
                <option value="PGK_KATEGORI">PGK Kategori (Benar / Salah)</option>
              </select>
            </div>
          </div>

          <div class="mb-4">
            <label for="txtPertanyaan" class="form-label fw-bold small">📝 Pokok Pertanyaan / Soal</label>
            <textarea id="txtPertanyaan" class="form-control" rows="4" placeholder="Tuliskan pertanyaan soal dengan jelas di sini..." required></textarea>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-end mb-3">
              <label class="form-label fw-bold small mb-0">🎯 Opsi &amp; Kunci Jawaban</label>
              <button type="button" class="btn btn-sm btn-outline-primary fw-bold rounded-pill px-3" onclick="tambahBarisOpsi()">
                ➕ Tambah Opsi
              </button>
            </div>
            <!-- Container Opsi -->
            <div id="containerFormOpsi" class="opsi-container shadow-sm"></div>
          </div>

          <button type="submit" id="btnSimpan" class="btn btn-simpan btn-lg w-100 fw-bold py-3 mt-2 shadow-sm">
            💾 Simpan Soal ke Database
          </button>
        </form>
      </div>
    </div>

    <!-- PANEL KANAN: DAFTAR SOAL -->
    <div class="col-lg-5">
      <div class="card card-custom p-4 p-md-5 h-100">
        <h4 class="fw-bold mb-4 text-dark d-flex align-items-center gap-2">
          📋 Soal Terdaftar
        </h4>
        <div id="containerListSoal" class="list-soal-wrapper">
          <div class="text-center py-5 text-muted">
            <div class="fs-1 mb-2">📂</div>
            <p class="fw-semibold">Pilih Mata Pelajaran di samping<br>untuk melihat daftar soal.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth-nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const session = JSON.parse(localStorage.getItem('userSession'));

  document.addEventListener("DOMContentLoaded", function() {
    if (session) {
      document.getElementById('namaGuru').innerText = session.nama || 'Guru';
    }
    loadDaftarMapel();
    renderFormOpsi();
  });

  function loadDaftarMapel() {
    const select = document.getElementById('selectMapel');
    
    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ 
        action: 'getMapel', 
        kelas: 'guru',
        idUser: session ? session.id : ''
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success' && data.mapel && data.mapel.length > 0) {
        select.innerHTML = '<option value="">-- Pilih Mata Pelajaran --</option>';
        data.mapel.forEach(m => {
          select.innerHTML += `<option value="${m.idMapel}">${m.namaMapel} (${m.idMapel}) - Kelas ${m.kelas}</option>`;
        });
      } else {
        select.innerHTML = '<option value="">Belum ada mapel tersedia</option>';
      }
    })
    .catch(err => {
      console.error(err);
      select.innerHTML = '<option value="">Gagal memuat mapel</option>';
    });
  }

  function renderFormOpsi() {
    const tipe = document.getElementById('selectTipe').value;
    const container = document.getElementById('containerFormOpsi');
    container.innerHTML = '';

    if (tipe === 'PG_SEDERHANA') {
      for (let i = 0; i < 4; i++) container.innerHTML += createOpsiRowPG(i, 'radio');
    } else if (tipe === 'PGK_MCMA') {
      for (let i = 0; i < 4; i++) container.innerHTML += createOpsiRowPG(i, 'checkbox');
    } else if (tipe === 'PGK_KATEGORI') {
      for (let i = 0; i < 3; i++) container.innerHTML += createOpsiRowKategori(i);
    }
  }

  function createOpsiRowPG(index, inputType) {
    const labelBadge = String.fromCharCode(65 + index); // A, B, C...
    return `
      <div class="row g-2 align-items-center mb-3 opsi-item">
        <div class="col-auto">
          <div class="badge-opsi text-white shadow-sm">${labelBadge}</div>
        </div>
        <div class="col">
          <input type="text" class="form-control txt-opsi bg-light border-0" placeholder="Tulis teks opsi ${labelBadge}..." required>
        </div>
        <div class="col-auto text-center" style="min-width: 90px;">
          <div class="form-check form-check-inline me-0">
            <input class="form-check-input chk-kunci border-secondary" type="${inputType}" name="kunciChoice" id="kunci_${index}">
            <label class="form-check-label fw-bold text-success small" for="kunci_${index}">Kunci</label>
          </div>
        </div>
      </div>`;
  }

  function createOpsiRowKategori(index) {
    return `
      <div class="row g-2 align-items-center mb-3 opsi-item">
        <div class="col-auto">
          <div class="badge-opsi text-white shadow-sm">${index + 1}</div>
        </div>
        <div class="col">
          <input type="text" class="form-control txt-opsi bg-light border-0" placeholder="Tulis pernyataan ${index + 1}..." required>
        </div>
        <div class="col-auto">
          <select class="form-select select-kunci-kat border-secondary fw-bold" style="width: 110px;">
            <option value="Benar">✅ Benar</option>
            <option value="Salah">❌ Salah</option>
          </select>
        </div>
      </div>`;
  }

  function tambahBarisOpsi() {
    const tipe = document.getElementById('selectTipe').value;
    const container = document.getElementById('containerFormOpsi');
    const currentCount = container.querySelectorAll('.opsi-item').length;

    if (tipe === 'PG_SEDERHANA') container.insertAdjacentHTML('beforeend', createOpsiRowPG(currentCount, 'radio'));
    else if (tipe === 'PGK_MCMA') container.insertAdjacentHTML('beforeend', createOpsiRowPG(currentCount, 'checkbox'));
    else if (tipe === 'PGK_KATEGORI') container.insertAdjacentHTML('beforeend', createOpsiRowKategori(currentCount));
  }

  function simpanSoal(e) {
    e.preventDefault();
    const idMapel = document.getElementById('selectMapel').value;
    const tipe = document.getElementById('selectTipe').value;
    const pertanyaan = document.getElementById('txtPertanyaan').value;

    if (!idMapel) { alert("Pilih Mata Pelajaran!"); return; }

    const arrayOpsi = [];
    let kunciJawaban = null;

    if (tipe === 'PG_SEDERHANA') {
      document.querySelectorAll('.opsi-item').forEach(item => {
        const txt = item.querySelector('.txt-opsi').value.trim();
        if (txt) {
          arrayOpsi.push(txt);
          if (item.querySelector('.chk-kunci').checked) kunciJawaban = txt;
        }
      });
      if (!kunciJawaban) { alert("Pilih 1 kunci jawaban!"); return; }
    } 
    else if (tipe === 'PGK_MCMA') {
      kunciJawaban = [];
      document.querySelectorAll('.opsi-item').forEach(item => {
        const txt = item.querySelector('.txt-opsi').value.trim();
        if (txt) {
          arrayOpsi.push(txt);
          if (item.querySelector('.chk-kunci').checked) kunciJawaban.push(txt);
        }
      });
      if (kunciJawaban.length === 0) { alert("Pilih minimal 1 kunci jawaban!"); return; }
    } 
    else if (tipe === 'PGK_KATEGORI') {
      kunciJawaban = {};
      document.querySelectorAll('.opsi-item').forEach(item => {
        const txt = item.querySelector('.txt-opsi').value.trim();
        if (txt) {
          arrayOpsi.push(txt);
          // Mengambil value (Benar/Salah) menghilangkan icon emoji jika diperlukan, 
          // namun value form select sudah di-set value murninya ("Benar" / "Salah")
          kunciJawaban[txt] = item.querySelector('.select-kunci-kat').value;
        }
      });
    }

    const btnSimpan = document.getElementById('btnSimpan');
    btnSimpan.disabled = true;
    btnSimpan.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Menyimpan...';

    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'addSoal',
        idMapel: idMapel,
        tipe: tipe,
        pertanyaan: pertanyaan,
        opsi: arrayOpsi,
        kunci: kunciJawaban
      })
    })
    .then(res => res.json())
    .then(data => {
      btnSimpan.disabled = false;
      btnSimpan.innerHTML = '💾 Simpan Soal ke Database';

      if (data.status === 'success') {
        alert("Berhasil menyimpan soal!");
        document.getElementById('txtPertanyaan').value = '';
        renderFormOpsi();
        loadDaftarSoal(idMapel);
      } else {
        alert("Gagal: " + data.message);
      }
    })
    .catch(() => {
      btnSimpan.disabled = false;
      btnSimpan.innerHTML = '💾 Simpan Soal ke Database';
      alert("Terjadi kesalahan koneksi!");
    });
  }

  function loadDaftarSoal(idMapel) {
    const container = document.getElementById('containerListSoal');
    if (!idMapel) {
      container.innerHTML = `
        <div class="text-center py-5 text-muted">
          <div class="fs-1 mb-2">📂</div>
          <p class="fw-semibold">Pilih Mata Pelajaran di samping<br>untuk melihat daftar soal.</p>
        </div>`;
      return;
    }

    container.innerHTML = `
      <div class="text-center py-5">
        <div class="spinner-border text-primary mb-2"></div>
        <div class="text-muted fw-semibold">Memuat soal...</div>
      </div>`;

    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getSoal', idMapel: idMapel, kelas: 'guru' })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success' && data.soal && data.soal.length > 0) {
        container.innerHTML = '';
        data.soal.forEach((s, i) => {
          container.innerHTML += `
            <div class="card p-3 mb-3 soal-card">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold text-primary">#${i+1} <small class="text-muted fw-normal">(${s.idSoal})</small></span>
                <div class="d-flex align-items-center gap-2">
                  <span class="badge bg-light border border-info text-info badge-tipe">${s.tipe}</span>
                  <button class="btn btn-sm btn-outline-danger py-0 px-2 fw-bold" onclick="hapusSoal('${s.idSoal}')" title="Hapus Soal">🗑️</button>
                </div>
              </div>
              <p class="mb-2 text-dark fs-6">${s.pertanyaan}</p>
              <small class="text-secondary fw-semibold">➤ Jumlah Opsi: ${s.opsi.length}</small>
            </div>`;
        });
      } else {
        container.innerHTML = `
          <div class="text-center py-5 text-muted bg-light rounded-3 border">
            <div class="fs-2 mb-2">📄</div>
            <p class="mb-0 fw-semibold">Belum ada soal untuk mata pelajaran ini.</p>
          </div>`;
      }
    })
    .catch(err => {
      console.error(err);
      container.innerHTML = '<div class="alert alert-danger text-center fw-bold mt-3">Gagal memuat soal. Cek koneksi Anda.</div>';
    });
  }

  function hapusSoal(idSoal) {
    if (!confirm(`Apakah Anda yakin ingin menghapus soal ini?`)) return;

    const idMapel = document.getElementById('selectMapel').value;

    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'deleteSoal',
        idSoal: idSoal
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        loadDaftarSoal(idMapel);
      } else {
        alert("Gagal menghapus soal: " + (data.message || "Terjadi kesalahan."));
      }
    })
    .catch(err => {
      console.error(err);
      alert("Terjadi kesalahan koneksi saat menghapus soal.");
    });
  }
</script>
</body>
</html>
