<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Ujian - KTSM8</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .card-soal { border: none; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .form-check-input:checked { background-color: #198754; border-color: #198754; }
    .badge-pelanggaran { font-size: 0.85rem; }
    .sticky-header { position: sticky; top: 10px; z-index: 1020; }
    .table-kategori td, .table-kategori th { vertical-align: middle; }
  </style>
</head>
<body>

<div class="container py-4">
  <!-- BOX PILIH MAPEL & MULAI -->
  <div id="boxMulai" class="row justify-content-center">
    <div class="col-md-6">
      <div class="card card-soal p-4 text-center">
        <h3 class="fw-bold mb-3">Ruang Ujian</h3>
        <p class="text-muted">Pilih mata pelajaran dan tekan tombol di bawah untuk memulai ujian dalam mode layar penuh.</p>
        
        <div class="mb-3 text-start">
          <label for="selectMapel" class="form-label fw-bold">Mata Pelajaran</label>
          <select id="selectMapel" class="form-select form-select-lg">
            <option value="">-- Memuat Mata Pelajaran --</option>
          </select>
        </div>

        <div class="alert alert-warning text-start" role="alert">
          <small><b>⚠️ Aturan Ujian:</b> Dilarang berpindah tab, membuka aplikasi lain, atau keluar dari mode layar penuh selama ujian berlangsung.</small>
        </div>

        <button onclick="mulaiUjian()" id="btnMulai" class="btn btn-success btn-lg w-100 fw-bold">🚀 Mulai Ujian Sekarang</button>
      </div>
    </div>
  </div>

  <!-- BOX AREA SOAL UJIAN -->
  <div id="boxSoal" style="display:none;">
    <!-- Sticky Status Bar -->
    <div class="card card-soal p-3 mb-4 sticky-header bg-white border-start border-4 border-success">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h5 id="judulMapel" class="fw-bold mb-0">Ujian Berlangsung</h5>
          <small class="text-muted">Siswa: <b id="namaSiswa">-</b></small>
        </div>
        <div>
          <span class="badge bg-danger badge-pelanggaran" id="badgePelanggaran">Pelanggaran: 0x</span>
        </div>
      </div>
    </div>

    <!-- Container Daftar Soal -->
    <div id="containerSoal" class="mb-4"></div>

    <!-- Tombol Submit -->
    <div class="card card-soal p-3 text-end">
      <button onclick="submitJawaban()" id="btnSubmit" class="btn btn-primary btn-lg px-5 fw-bold">📤 Kirim Jawaban</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth-nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let jumlahPelanggaran = 0;
  let mapelTerpilih = '';
  let listSoalLoaded = []; // Menyimpan data soal aktif
  const session = JSON.parse(localStorage.getItem('userSession'));

  document.addEventListener("DOMContentLoaded", function() {
    if (session) {
      document.getElementById('namaSiswa').innerText = session.nama;
    }
    loadDaftarMapel();
  });

  // 1. Ambil Daftar Mapel
  function loadDaftarMapel() {
    const select = document.getElementById('selectMapel');
    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getMapel' })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success' && data.mapel && data.mapel.length > 0) {
        select.innerHTML = '<option value="">-- Pilih Mata Pelajaran --</option>';
        data.mapel.forEach(m => {
          select.innerHTML += `<option value="${m.idMapel}">${m.namaMapel} (${m.idMapel})</option>`;
        });
      } else {
        select.innerHTML = '<option value="">Tidak ada mata pelajaran tersedia</option>';
      }
    })
    .catch(() => {
      select.innerHTML = '<option value="">Gagal memuat mata pelajaran</option>';
    });
  }

  // 2. Anti-Cheat (Pindah Tab)
  document.addEventListener("visibilitychange", function() {
    if (document.hidden && document.getElementById('boxSoal').style.display !== 'none') {
      jumlahPelanggaran++;
      document.getElementById('badgePelanggaran').innerText = `Pelanggaran: ${jumlahPelanggaran}x`;
      alert(`PERINGATAN! Terdeteksi meninggalkan layar ujian (${jumlahPelanggaran}x).\nCatatan ini akan dikirim ke sistem.`);
    }
  });

  // 3. Mulai Ujian
  function mulaiUjian() {
    const select = document.getElementById('selectMapel');
    mapelTerpilih = select.value;

    if (!mapelTerpilih) {
      alert("Silakan pilih Mata Pelajaran terlebih dahulu!");
      return;
    }

    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }

    const selectedText = select.options[select.selectedIndex].text;
    document.getElementById('judulMapel').innerText = selectedText;
    document.getElementById('boxMulai').style.display = 'none';
    document.getElementById('boxSoal').style.display = 'block';

    loadSoal(mapelTerpilih);
  }

  // 4. Render Soal Berdasarkan Tipe
  function loadSoal(idMapel) {
    const container = document.getElementById('containerSoal');
    container.innerHTML = `
      <div class="card card-soal p-4 text-center">
        <div class="spinner-border text-success mx-auto mb-2" role="status"></div>
        <span>Memuat soal ujian...</span>
      </div>`;

    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getSoal', idMapel: idMapel })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success' && data.soal && data.soal.length > 0) {
        listSoalLoaded = data.soal;
        container.innerHTML = '';
        
        data.soal.forEach((s, idx) => {
          let htmlKonten = '';
          const tipe = s.tipe || 'PG_SEDERHANA';

          // Tipe 1: PG SEDERHANA (Single Choice)
          if (tipe === 'PG_SEDERHANA') {
            s.opsi.forEach((o, oIdx) => {
              const inputId = `opt_${s.idSoal}_${oIdx}`;
              htmlKonten += `
                <div class="form-check p-2 rounded border mb-2 bg-light">
                  <input class="form-check-input ms-1" type="radio" name="soal_${s.idSoal}" id="${inputId}" value="${o}">
                  <label class="form-check-label w-100 ms-2" for="${inputId}">${o}</label>
                </div>`;
            });
          }
          // Tipe 2: PGK MCMA (Multiple Choice Multiple Answers)
          else if (tipe === 'PGK_MCMA') {
            htmlKonten += `<div class="text-muted small mb-2"><i>(Pilih satu atau lebih jawaban yang benar)</i></div>`;
            s.opsi.forEach((o, oIdx) => {
              const inputId = `opt_${s.idSoal}_${oIdx}`;
              htmlKonten += `
                <div class="form-check p-2 rounded border mb-2 bg-light">
                  <input class="form-check-input ms-1" type="checkbox" name="soal_${s.idSoal}" id="${inputId}" value="${o}">
                  <label class="form-check-label w-100 ms-2" for="${inputId}">${o}</label>
                </div>`;
            });
          }
          // Tipe 3: PGK KATEGORI (Tabel Pernyataan Benar / Salah)
          else if (tipe === 'PGK_KATEGORI') {
            htmlKonten += `
              <div class="text-muted small mb-2"><i>(Tentukan respon Benar/Salah untuk setiap pernyataan di bawah)</i></div>
              <div class="table-responsive">
                <table class="table table-bordered table-kategori mt-2">
                  <thead class="table-secondary text-center">
                    <tr>
                      <th>Pernyataan / Respon</th>
                      <th style="width: 100px;">Benar</th>
                      <th style="width: 100px;">Salah</th>
                    </tr>
                  </thead>
                  <tbody>`;
            
            s.opsi.forEach((o, oIdx) => {
              const nameGroup = `kategori_${s.idSoal}_${oIdx}`;
              htmlKonten += `
                <tr>
                  <td>${o}</td>
                  <td class="text-center">
                    <input class="form-check-input" type="radio" name="${nameGroup}" data-item="${o}" value="Benar">
                  </td>
                  <td class="text-center">
                    <input class="form-check-input" type="radio" name="${nameGroup}" data-item="${o}" value="Salah">
                  </td>
                </tr>`;
            });

            htmlKonten += `</tbody></table></div>`;
          }

          container.innerHTML += `
            <div class="card card-soal p-4 mb-3">
              <div class="d-flex align-items-start gap-2 mb-3">
                <span class="badge bg-success fs-6">${idx + 1}</span>
                <div class="fw-bold fs-5 text-dark">${s.pertanyaan}</div>
              </div>
              <div class="opsi-container">${htmlKonten}</div>
            </div>`;
        });
      } else {
        container.innerHTML = `<div class="card card-soal p-4 text-center text-muted">Belum ada soal yang tersedia untuk mata pelajaran ini.</div>`;
        document.getElementById('btnSubmit').style.display = 'none';
      }
    })
    .catch(() => {
      container.innerHTML = `<div class="card card-soal p-4 text-center text-danger">Gagal memuat soal. Periksa koneksi internet Anda.</div>`;
    });
  }

  // 5. Submit & Packaging Jawaban
  function submitJawaban() {
    if (!confirm("Apakah Anda yakin ingin menyelesaikan ujian ini?")) return;

    const btnSubmit = document.getElementById('btnSubmit');
    btnSubmit.disabled = true;
    btnSubmit.innerText = 'Mengirim Jawaban...';

    const listJawaban = [];

    listSoalLoaded.forEach(s => {
      const tipe = s.tipe || 'PG_SEDERHANA';

      if (tipe === 'PG_SEDERHANA') {
        const checked = document.querySelector(`[name="soal_${s.idSoal}"]:checked`);
        listJawaban.push({
          idSoal: s.idSoal,
          jawaban: checked ? checked.value : ''
        });
      } 
      else if (tipe === 'PGK_MCMA') {
        const checkboxes = document.querySelectorAll(`[name="soal_${s.idSoal}"]:checked`);
        const ansArr = Array.from(checkboxes).map(c => c.value);
        listJawaban.push({
          idSoal: s.idSoal,
          jawaban: ansArr
        });
      } 
      else if (tipe === 'PGK_KATEGORI') {
        const katResult = {};
        s.opsi.forEach((o, oIdx) => {
          const checkedKat = document.querySelector(`[name="kategori_${s.idSoal}_${oIdx}"]:checked`);
          katResult[o] = checkedKat ? checkedKat.value : '';
        });
        listJawaban.push({
          idSoal: s.idSoal,
          jawaban: katResult
        });
      }
    });

    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'submitUjian',
        idSiswa: session ? session.id : 'ANON',
        idMapel: mapelTerpilih,
        jawaban: listJawaban,
        pelanggaran: jumlahPelanggaran
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        alert(`Ujian Selesai!\nNilai Anda: ${data.nilai}`);
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        window.location.href = session && session.role === 'guru' ? 'dashboard-guru.html' : 'dashboard-siswa.html';
      } else {
        alert('Gagal mengirim jawaban: ' + data.message);
        btnSubmit.disabled = false;
        btnSubmit.innerText = '📤 Kirim Jawaban';
      }
    })
    .catch(() => {
      alert('Terjadi kesalahan koneksi saat mengirim jawaban.');
      btnSubmit.disabled = false;
      btnSubmit.innerText = '📤 Kirim Jawaban';
    });
  }
</script>
</body>
</html>
