<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Ujian - KTSM8</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #f4f6f9; }
    .container { max-width: 700px; margin: 0 auto; padding: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .soal-box { margin-bottom: 15px; }
    .opsi-box { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    button { padding: 10px 20px; background: #198754; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <div class="card" id="boxMulai">
    <h2>Ruang Ujian</h2><br>
    <p>Klik tombol di bawah untuk memulai ujian dalam mode layar penuh.</p><br>
    <button onclick="mulaiUjian()">Mulai Ujian Now</button>
  </div>

  <div id="boxSoal" style="display:none;">
    <div class="card">
      <h3 id="judulMapel">Ujian Berlangsung</h3>
      <p style="color:red; font-size:12px; margin-top:5px;">Dilarang berpindah tab atau meninggalkan layar!</p>
    </div>
    
    <div id="containerSoal"></div>
    
    <button onclick="submitJawaban()" id="btnSubmit">Kirim Jawaban</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth-nav.js"></script>
<script>
  let jumlahPelanggaran = 0;
  const session = JSON.parse(localStorage.getItem('userSession'));

  // Deteksi Kecurangan (Pindah Tab)
  document.addEventListener("visibilitychange", function() {
    if (document.hidden && document.getElementById('boxSoal').style.display !== 'none') {
      jumlahPelanggaran++;
      alert(`PERINGATAN! Terdeteksi meninggalkan layar ujian (${jumlahPelanggaran}x). Catatan ini akan dikirim ke guru.`);
    }
  });

  function mulaiUjian() {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    document.getElementById('boxMulai').style.display = 'none';
    document.getElementById('boxSoal').style.display = 'block';
    
    // Contoh load soal statis/dinamis dari GAS
    loadSoal('MP001');
  }

  function loadSoal(idMapel) {
    const container = document.getElementById('containerSoal');
    container.innerHTML = 'Memuat soal...';

    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getSoal', idMapel: idMapel })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success' && data.soal.length > 0) {
        container.innerHTML = '';
        data.soal.forEach((s, idx) => {
          let htmlOpsi = '';
          s.opsi.forEach(o => {
            htmlOpsi += `
              <label><input type="radio" name="soal_${s.idSoal}" value="${o}"> ${o}</label>
            `;
          });

          container.innerHTML += `
            <div class="card soal-box">
              <p><b>${idx + 1}. ${s.pertanyaan}</b></p>
              <div class="opsi-box">${htmlOpsi}</div>
            </div>`;
        });
      } else {
        container.innerHTML = '<div class="card">Belum ada soal untuk mata pelajaran ini.</div>';
      }
    });
  }

  function submitJawaban() {
    if (!confirm("Apakah Anda yakin ingin menyelesaikan ujian?")) return;

    // Kumpulkan jawaban
    const listJawaban = [];
    document.querySelectorAll('[name^="soal_"]').forEach(input => {
      if (input.checked) {
        listJawaban.push({
          idSoal: input.name.replace('soal_', ''),
          jawaban: input.value
        });
      }
    });

    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'submitUjian',
        idSiswa: session.id,
        idMapel: 'MP001',
        jawaban: listJawaban,
        pelanggaran: jumlahPelanggaran
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        alert(`Ujian Selesai! Nilai Anda: ${data.nilai}`);
        window.location.href = 'dashboard-siswa.html';
      } else {
        alert('Gagal mengirim: ' + data.message);
      }
    });
  }
</script>
</body>
</html>
