<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portal Akademik</title>
  <!-- Menggunakan Bootstrap 5 untuk layout & responsivitas -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Menggunakan font Nunito agar senada dengan halaman lainnya */
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
    
    body { 
      background-color: #f8f9fa; 
      font-family: 'Nunito', sans-serif; 
      /* Menambahkan aksen background lembut di area login */
      background-image: radial-gradient(circle at top right, #e0f2fe 0%, #f8f9fa 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Card Custom Style */
    .card-login { 
      background: #ffffff;
      border: 1px solid #edf2f9; 
      border-radius: 24px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.05); 
      width: 100%; 
      max-width: 400px;
      padding: 40px 30px;
      position: relative;
      overflow: hidden;
    }

    /* Aksen garis atas pada card */
    .card-login::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    /* Ikon Logo */
    .icon-wrapper {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 100%);
      border: 2px solid #bae6fd;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 15px auto;
      box-shadow: 0 8px 15px rgba(79, 172, 254, 0.15);
    }

    /* Form Styling */
    .form-label { 
      color: #495057; 
      font-weight: 700;
      font-size: 0.9rem;
    }
    .form-control {
      border-radius: 12px;
      border: 1px solid #dee2e6;
      padding: 12px 15px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background-color: #fdfdfe;
    }
    .form-control:focus {
      border-color: #4facfe;
      background-color: #ffffff;
      box-shadow: 0 0 0 0.25rem rgba(79, 172, 254, 0.25);
    }

    /* Tombol Login Gradient */
    .btn-login {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      border: none;
      color: white;
      border-radius: 12px;
      font-weight: 800;
      padding: 12px;
      font-size: 1rem;
      letter-spacing: 0.5px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 242, 254, 0.4);
      color: white;
    }
    .btn-login:disabled {
      background: #a5c7fe;
      transform: none;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Alert Styling */
    .alert-custom {
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 12px;
      display: none;
      border: none;
    }
  </style>
</head>
<body>

<div class="container d-flex justify-content-center">
  <div class="card-login">
    
    <!-- Header Logo & Title -->
    <div class="text-center mb-4">
      <div class="icon-wrapper">🎓</div>
      <h3 class="fw-bold text-dark mb-1">Portal Akademik</h3>
      <p class="text-secondary small fw-semibold">Silakan masuk untuk melanjutkan</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="alert alert-danger alert-custom text-center mb-4" role="alert"></div>
    
    <!-- Form Login -->
    <form id="formLogin">
      <div class="mb-3">
        <label for="username" class="form-label">ID / Username</label>
        <input type="text" id="username" class="form-control" placeholder="Masukkan ID Anda" required autocomplete="off">
      </div>
      
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
      </div>
      
      <button type="submit" id="btnLogin" class="btn btn-login w-100 mt-2">
        Masuk
      </button>
    </form>
    
    <div class="text-center mt-4">
      <small class="text-muted fw-semibold">&copy; 2026 Portal Akademik</small>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  document.getElementById('formLogin').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const alertBox = document.getElementById('alertBox');
    
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Memeriksa...';
    alertBox.style.display = 'none';

    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'login',
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value.trim()
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        localStorage.setItem('userSession', JSON.stringify(data.user));
        // Redirect berdasarkan role
        if (data.user.role === 'guru') {
          window.location.href = 'dashboard-guru.html';
        } else {
          window.location.href = 'dashboard-siswa.html';
        }
      } else {
        alertBox.innerText = data.message;
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Masuk';
      }
    })
    .catch(() => {
      alertBox.innerText = 'Koneksi gagal! Silakan periksa jaringan Anda.';
      alertBox.style.display = 'block';
      btn.disabled = false;
      btn.innerText = 'Masuk';
    });
  });
</script>
</body>
</html>
