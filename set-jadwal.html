<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Jadwal Mengajar</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #e2e8f0;
            --input-focus: #bfdbfe;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }
        
        /* Navbar */
        header { background-color: var(--card-bg); padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; color: var(--primary); }
        nav a { text-decoration: none; color: var(--text-muted); margin-left: 1.5rem; font-weight: 500; transition: color 0.3s; }
        nav a:hover, nav a.active { color: var(--primary); }

        /* Container */
        .container { max-width: 600px; margin: 3rem auto; padding: 0 1rem; }
        
        /* Form Card */
        .card { background-color: var(--card-bg); padding: 2rem; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .card h2 { margin-bottom: 0.5rem; font-size: 1.5rem; }
        .card p { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem; }

        /* Form Group */
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 0.4rem; color: var(--text-main); font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; transition: border 0.3s, box-shadow 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--input-focus); }
        
        .form-row { display: flex; gap: 1rem; }
        .form-row .form-group { flex: 1; }

        /* Button */
        .btn { display: block; width: 100%; background-color: var(--primary); color: white; padding: 0.8rem; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-top: 1rem; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: transparent; color: var(--text-muted); text-align: center; display: block; margin-top: 1rem; text-decoration: none; font-size: 0.9rem; }
        .btn-secondary:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <header>
        <h1>Portal Guru</h1>
        <nav>
            <a href="dashboard-guru.html">Dashboard</a>
            <a href="set-jadwal.html" class="active">Set Jadwal</a>
            <a href="#">Data Nilai</a>
            <a href="#">Profil</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h2>Buat Jadwal Baru</h2>
            <p>Masukkan detail jadwal mengajar Anda di bawah ini.</p>

            <form action="#" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="hari">Hari</label>
                        <select id="hari" name="hari" required>
                            <option value="">-- Pilih Hari --</option>
                            <option value="Senin">Senin</option>
                            <option value="Selasa">Selasa</option>
                            <option value="Rabu">Rabu</option>
                            <option value="Kamis">Kamis</option>
                            <option value="Jumat">Jumat</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="kelas">Kelas</label>
                        <select id="kelas" name="kelas" required>
                            <option value="">-- Pilih Kelas --</option>
                            <option value="X">Kelas X</option>
                            <option value="XI">Kelas XI</option>
                            <option value="XII">Kelas XII</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mapel">Mata Pelajaran</label>
                    <input type="text" id="mapel" name="mapel" placeholder="Contoh: Biologi Lintas Minat" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="jam_mulai">Jam Mulai</label>
                        <input type="time" id="jam_mulai" name="jam_mulai" required>
                    </div>
                    <div class="form-group">
                        <label for="jam_selesai">Jam Selesai</label>
                        <input type="time" id="jam_selesai" name="jam_selesai" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="ruang">Ruang Kelas</label>
                    <input type="text" id="ruang" name="ruang" placeholder="Contoh: R. 204 atau Lab IPA" required>
                </div>

                <button type="submit" class="btn">Simpan Jadwal</button>
                <a href="dashboard-guru.html" class="btn-secondary">Kembali ke Dashboard</a>
            </form>
        </div>
    </div>

</body>
</html>
