<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Nilai Siswa - Portal Akademik</title>
  <!-- Menggunakan Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Menggunakan font Nunito agar senada dengan Dashboard */
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
    
    body { 
      background-color: #f8f9fa; 
      font-family: 'Nunito', sans-serif; 
    }
    
    /* Navbar Gradient Senada dengan Dashboard */
    .navbar-custom { 
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* Style Custom untuk Card */
    .card-custom { 
      background: #ffffff;
      border-radius: 20px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
      border: 1px solid #edf2f9; 
    }

    /* Style untuk Tabel */
    .table-wrapper {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #eaeaea;
    }
    .table-hover tbody tr:hover { 
      background-color: #f1f9ff; /* Efek hover biru sangat muda */
      transition: background-color 0.3s ease;
    }
    .th-gradient { 
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%) !important; 
      color: white !important; 
      border-bottom: none;
    }

    /* Style Tombol Refresh Custom */
    .btn-refresh {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      border: none;
      color: white;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .btn-refresh:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
      color: white;
    }

    /* Custom Badge untuk Nilai */
    .badge-nilai {
      padding: 8px 0;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<!-- NAVBAR UTAMA -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-4 py-3">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4" href="dashboard-guru.html">
      <span>🎓 Portal Guru</span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <div class="text-white fw-bold d-none d-md-block">
        Halo, <span id="navNamaUser">-</span>!
      </div>
      <button onclick="logout()" class="btn btn-light btn-sm fw-bold text-primary rounded-pill px-4 py-2 shadow-sm">Logout</button>
    </div>
  </div>
</nav>

<div class="container py-5">
  <!-- HEADER SECTION -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold text-dark mb-1">📊 Rekap Nilai Siswa</h3>
      <p class="text-secondary mb-0">Pantau dan kelola hasil ujian siswa berdasarkan kelas dan mata pelajaran.</p>
    </div>
    <a href="dashboard-guru.html" class="btn btn-outline-secondary rounded-pill px-4 fw-bold shadow-sm bg-white">
      ⬅ Kembali
    </a>
  </div>

  <!-- PANEL FILTER -->
  <div class="card card-custom p-4 mb-4">
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label class="form-label fw-bold text-secondary small">🏫 Filter Kelas</label>
        <select id="filterKelas" class="form-select border-primary-subtle shadow-sm" onchange="renderTable()">
          <option value="SEMUA">Semua Kelas</option>
          
          <optgroup label="Kelas 7">
            <option value="7A">7A</option>
            <option value="7B">7B</option>
            <option value="7C">7C</option>
            <option value="7D">7D</option>
            <option value="7E">7E</option>
            <option value="7F">7F</option>
          </optgroup>
          
          <optgroup label="Kelas 8">
            <option value="8A">8A</option>
            <option value="8B">8B</option>
            <option value="8C">8C</option>
            <option value="8D">8D</option>
            <option value="8E">8E</option>
            <option value="8F">8F</option>
            <option value="8G">8G</option>
          </optgroup>
          
          <optgroup label="Kelas 9">
            <option value="9A">9A</option>
            <option value="9B">9B</option>
            <option value="9C">9C</option>
            <option value="9D">9D</option>
            <option value="9E">9E</option>
            <option value="9F">9F</option>
          </optgroup>
        </select>
      </div>
      
      <div class="col-md-5">
        <label class="form-label fw-bold text-secondary small">📚 Filter Mata Pelajaran</label>
        <select id="filterMapel" class="form-select border-primary-subtle shadow-sm" onchange="renderTable()">
          <option value="SEMUA">Semua Mata Pelajaran</option>
        </select>
      </div>
      
      <div class="col-md-2">
        <button onclick="loadDataRekap()" class="btn btn-refresh w-100 fw-bold py-2 shadow-sm rounded-3">
          🔄 Refresh
        </button>
      </div>
    </div>
  </div>

  <!-- TABEL DATA -->
  <div class="card card-custom p-4">
    <div class="table-wrapper">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr class="text-center th-gradient">
            <th width="5%" class="py-3">No</th>
            <th width="25%" class="py-3 text-start">Nama Siswa</th>
            <th width="10%" class="py-3">Kelas</th>
            <th width="25%" class="py-3 text-start">Mata Pelajaran</th>
            <th width="15%" class="py-3">Nilai Akhir</th>
            <th width="20%" class="py-3">Tanggal Ujian</th>
          </tr>
        </thead>
        <tbody id="bodyTableRekap">
          <tr>
            <td colspan="6" class="text-center py-5 text-muted">
              <div class="spinner-border text-primary mb-2" role="status"></div>
              <p class="mb-0 fw-semibold">Memuat data dari server...</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  let dataRekapGlobal = [];
  
  // Cek Sesi
  const session = JSON.parse(localStorage.getItem('userSession'));
  if (!session || session.role !== 'guru') {
    alert("Akses ditolak! Halaman ini khusus Guru.");
    window.location.href = "index.html";
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById('navNamaUser').innerText = session.nama;
    loadDataRekap();
  });

  // Fetch Data dari Apps Script
  function loadDataRekap() {
    const tbody = document.getElementById('bodyTableRekap');
    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="text-center py-5 text-muted">
          <div class="spinner-border text-primary mb-2" role="status"></div>
          <p class="mb-0 fw-semibold">Mengambil data...</p>
        </td>
      </tr>`;

    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getRekapNilai' })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        dataRekapGlobal = data.data;
        populateFilterMapel(data.data);
        renderTable();
      } else {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger fw-bold">${data.message}</td></tr>`;
      }
    })
    .catch(() => {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger fw-bold">Gagal terhubung ke server. Silakan cek koneksi internet.</td></tr>`;
    });
  }

  // Mengisi opsi Mapel secara dinamis
  function populateFilterMapel(data) {
    const select = document.getElementById('filterMapel');
    const mapelUnik = [...new Set(data.map(item => item.namaMapel))];
    
    let html = '<option value="SEMUA">Semua Mata Pelajaran</option>';
    mapelUnik.forEach(m => {
      if(m) html += `<option value="${m}">${m}</option>`;
    });
    select.innerHTML = html;
  }

  // Render Tabel dengan Filter
  function renderTable() {
    const filterKelas = document.getElementById('filterKelas').value;
    const filterMapel = document.getElementById('filterMapel').value;
    const tbody = document.getElementById('bodyTableRekap');
    
    let filteredData = dataRekapGlobal.filter(item => {
      const matchKelas = filterKelas === 'SEMUA' || String(item.kelas) === String(filterKelas);
      const matchMapel = filterMapel === 'SEMUA' || item.namaMapel === filterMapel;
      return matchKelas && matchMapel;
    });

    if (filteredData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted fw-semibold">📂 Tidak ada data yang sesuai dengan filter saat ini.</td></tr>`;
      return;
    }

    let html = '';
    filteredData.forEach((d, index) => {
      let badgeColor = d.nilai >= 75 ? 'bg-success' : 'bg-danger';
      html += `
        <tr>
          <td class="text-center fw-bold text-secondary">${index + 1}</td>
          <td class="fw-bold text-dark">${d.namaSiswa}</td>
          <td class="text-center fw-semibold text-primary">${d.kelas}</td>
          <td class="text-secondary fw-semibold">${d.namaMapel}</td>
          <td class="text-center">
            <div class="badge ${badgeColor} badge-nilai w-100">${d.nilai}</div>
          </td>
          <td class="text-center small text-secondary fw-semibold">${d.tanggal}</td>
        </tr>`;
    });
    
    tbody.innerHTML = html;
  }

  function logout() {
    if (confirm("Yakin ingin keluar?")) {
      localStorage.removeItem('userSession');
      window.location.href = "index.html";
    }
  }
</script>
</body>
</html>
